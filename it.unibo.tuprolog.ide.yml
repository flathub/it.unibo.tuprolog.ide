id: it.unibo.tuprolog.ide
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - "org.freedesktop.Sdk.Extension.openjdk17"
command: tuprolog-ide
finish-args:
  - "--env=PATH=/app/jre/bin:/app/bin:/usr/bin"
  - "--env=JAVA_HOME=/app/jre"
  - "--share=ipc"
  - "--socket=x11"
  - "--device=dri"
  - "--filesystem=home"
modules:
  - name: "openjdk"
    buildsystem: "simple"
    build-commands:
      - "/usr/lib/sdk/openjdk17/install.sh"
  - name: 2p-ide
    buildsystem: simple
    build-commands:
      - sed -i 's/viewBox="0 0 113 94" width="113" height="94"/viewBox="0 -9.5 113 113" width="113" height="113"/' it.unibo.tuprolog.ide.svg
      - install -Dm0664 -t ${FLATPAK_DEST}/ tuprolog-ide.jar
      - install -Dm0775 -t ${FLATPAK_DEST}/bin/ tuprolog-ide
      - install -Dm0664 -t ${FLATPAK_DEST}/share/applications/ it.unibo.tuprolog.ide.desktop
      - install -Dm0664 -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/ it.unibo.tuprolog.ide.svg
      - install -Dm0664 -t ${FLATPAK_DEST}/share/metainfo/ it.unibo.tuprolog.ide.metainfo.xml
    sources:
      - type: file
        url: https://github.com/tuProlog/2p-kt/releases/download/3.0.5/2p-ide-swing-3.0.5-redist.jar
        sha256: 0866fc06af8ba5b5810ee9555a66d928158f7513deca8f3fc36a3f6df493c116
        dest-filename: tuprolog-ide.jar
      - type: file
        url: https://raw.githubusercontent.com/tuProlog/2p-kt/refs/tags/3.0.5/.img/logos/2p-arcade.svg
        sha256: cb4d8713af8fadb357fee60cd3715d5ea9f969a9a2a0506b8e6d7fb45ed45523
        dest-filename: it.unibo.tuprolog.ide.svg
      - type: file
        url: https://raw.githubusercontent.com/tuProlog/2p-kt/refs/tags/3.0.5/it.unibo.tuprolog.ide.desktop
        sha256: e90d98bf0d4480035d683692d666d71eaafdaf3c619b20dc2dd20d81ae6f2285
      - type: file
        url: https://raw.githubusercontent.com/tuProlog/2p-kt/refs/tags/3.0.5/it.unibo.tuprolog.ide.metainfo.xml
        sha256: bdfe021092d16e52f6c83599e0a48e768f325e7124069e8eef5b7f975c1681f6
      - type: file
        url: https://raw.githubusercontent.com/tuProlog/2p-kt/refs/tags/3.0.5/.img/2p-kt-ide.png
        sha256: 4f221a4aab6141efbcdeff555580d4c7c496220df1a7bb8067aede19968af451

      - type: file
        path: tuprolog-ide
